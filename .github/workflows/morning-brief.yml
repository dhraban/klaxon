name: Klaxon morning brief

on:
  schedule:
    # Two separate UTC triggers cover 5:00 AM America/Chicago across daylight
    # saving time. The gate below recognizes the correct one without rejecting
    # a late GitHub start.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klaxon-state
  cancel-in-progress: false

jobs:
  send-morning-brief:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      PUSHOVER_APPLICATION_TOKEN: ${{ secrets.PUSHOVER_APPLICATION_TOKEN }}

    steps:
      - name: Check Central-time schedule
        id: schedule
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          offset="$(TZ=America/Chicago date +%z)"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$offset" = "-0500" ] && [ "$SCHEDULE_EXPRESSION" = "0 10 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$offset" = "-0600" ] && [ "$SCHEDULE_EXPRESSION" = "0 11 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Klaxon
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Restore durable Facebook outage schedule
        if: steps.schedule.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: klaxon_state.sqlite3
          key: morning-facebook-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            klaxon-state-

      - name: Restore latest power result
        if: steps.schedule.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: latest_post.json
          key: morning-power-result-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            klaxon-power-result-

      - name: Restore daily cyclone result
        if: steps.schedule.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: pagasa_daily_detector.json
          key: morning-cyclone-result-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pagasa-daily-result-

      - name: Restore latest watcher health result
        if: steps.schedule.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: watcher_health.json
          key: morning-health-result-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            watcher-health-

      - name: Download durable state branch
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: klaxon-state
          path: .klaxon-state
          fetch-depth: 1

      - name: Restore durable brief inputs
        if: steps.schedule.outputs.run == 'true'
        run: |
          python3 durable_state.py import --state-file klaxon_state.sqlite3 --json-file .klaxon-state/facebook_state.json
          if [ -f .klaxon-state/pagasa_daily_detector.json ]; then cp .klaxon-state/pagasa_daily_detector.json pagasa_daily_detector.json; fi
          if [ -f .klaxon-state/watcher_health.json ]; then cp .klaxon-state/watcher_health.json watcher_health.json; fi

      - name: Send morning brief
        if: steps.schedule.outputs.run == 'true'
        run: >-
          python3 morning_brief.py
          --power-file latest_post.json
          --cyclone-file pagasa_daily_detector.json
          --health-file watcher_health.json
          --state-file klaxon_state.sqlite3
          --output morning_brief.json
          --send-pushover
          --pretty
