name: Klaxon PHIVOLCS tsunami monitor

on:
  schedule:
    # Official tsunami bulletins can change quickly; poll the official page
    # every 15 minutes. The checker suppresses duplicate warning notifications.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tsunami:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      PUSHOVER_APPLICATION_TOKEN: ${{ secrets.PUSHOVER_APPLICATION_TOKEN }}
    steps:
      - name: Download Klaxon
        uses: actions/checkout@v4

      - name: Restore tsunami alert state
        uses: actions/cache/restore@v4
        with:
          path: phivolcs_tsunami_state.json
          key: phivolcs-tsunami-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            phivolcs-tsunami-state-

      - name: Check PHIVOLCS official bulletin
        run: >-
          python3 phivolcs_tsunami_check.py
          --state-file phivolcs_tsunami_state.json
          --output phivolcs_tsunami_latest.json
          --send-pushover
          --pretty

      - name: Preserve tsunami alert state
        if: ${{ always() && hashFiles('phivolcs_tsunami_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: phivolcs_tsunami_state.json
          key: phivolcs-tsunami-state-${{ github.run_id }}-${{ github.run_attempt }}
