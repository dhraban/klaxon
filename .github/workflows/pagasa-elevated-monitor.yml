name: Klaxon PAGASA elevated monitor

on:
  schedule:
    # Retain the approved 22:55 UTC quiet window. A gate below also yields at
    # 5:55 AM America/Chicago, when the daily detector owns the state transition.
    - cron: "55 0-21,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: klaxon-state
  cancel-in-progress: false

jobs:
  monitor-cyclone:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      PUSHOVER_APPLICATION_TOKEN: ${{ secrets.PUSHOVER_APPLICATION_TOKEN }}
    steps:
      - name: Yield to the Central-time daily detector
        id: schedule
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(TZ=America/Chicago date +%H:%M)" != "05:55" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Klaxon
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Restore PAGASA monitor state
        if: steps.schedule.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: pagasa_state.json
          key: pagasa-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pagasa-state-

      - name: Download durable state branch
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: klaxon-state
          path: .klaxon-state
          fetch-depth: 1

      - name: Restore durable PAGASA state
        if: steps.schedule.outputs.run == 'true'
        run: |
          if [ -f .klaxon-state/pagasa_state.json ]; then cp .klaxon-state/pagasa_state.json pagasa_state.json; fi

      - name: Install PDF reader
        if: steps.schedule.outputs.run == 'true'
        run: python3 -m pip install --disable-pip-version-check --no-warn-script-location -r requirements.txt

      - name: Run separate elevated monitor
        if: steps.schedule.outputs.run == 'true'
        run: >-
          python3 pagasa_cyclone_check.py
          --mode monitor
          --state-file pagasa_state.json
          --output pagasa_monitor.json
          --send-pushover
          --pretty

      - name: Preserve PAGASA monitor state
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('pagasa_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: pagasa_state.json
          key: pagasa-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve durable PAGASA state
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('pagasa_state.json') != '' }}
        run: cp pagasa_state.json .klaxon-state/pagasa_state.json

      - name: Commit durable PAGASA state
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('.klaxon-state/pagasa_state.json') != '' }}
        run: |
          cd .klaxon-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagasa_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Klaxon PAGASA monitor state"
            git push origin HEAD:klaxon-state
          fi
