name: Klaxon PAGASA daily detector

on:
  schedule:
    # Two separate UTC triggers cover 4:25 AM America/Chicago across daylight
    # saving time. The gate recognizes a delayed correct trigger.
    - cron: "25 9 * * *"
    - cron: "25 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: klaxon-state
  cancel-in-progress: false

jobs:
  detect-cyclone:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Central-time schedule
        id: schedule
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          offset="$(TZ=America/Chicago date +%z)"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$offset" = "-0500" ] && [ "$SCHEDULE_EXPRESSION" = "25 9 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$offset" = "-0600" ] && [ "$SCHEDULE_EXPRESSION" = "25 10 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Klaxon
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Restore PAGASA monitor state
        if: steps.schedule.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: pagasa_state.json
          key: pagasa-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pagasa-state-

      - name: Download durable state branch
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: klaxon-state
          path: .klaxon-state
          fetch-depth: 1

      - name: Restore durable PAGASA state
        if: steps.schedule.outputs.run == 'true'
        run: |
          if [ -f .klaxon-state/pagasa_state.json ]; then cp .klaxon-state/pagasa_state.json pagasa_state.json; fi

      - name: Install PDF reader
        if: steps.schedule.outputs.run == 'true'
        run: python3 -m pip install --disable-pip-version-check --no-warn-script-location -r requirements.txt

      - name: Run daily PAGASA detector without routine push
        if: steps.schedule.outputs.run == 'true'
        run: >-
          python3 pagasa_cyclone_check.py
          --mode daily-detector
          --state-file pagasa_state.json
          --output pagasa_daily_detector.json
          --pretty

      - name: Preserve daily cyclone result for morning brief
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('pagasa_daily_detector.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: pagasa_daily_detector.json
          key: pagasa-daily-result-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve PAGASA monitor state
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('pagasa_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: pagasa_state.json
          key: pagasa-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve durable PAGASA results
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('pagasa_state.json', 'pagasa_daily_detector.json') != '' }}
        run: |
          cp pagasa_state.json .klaxon-state/pagasa_state.json
          cp pagasa_daily_detector.json .klaxon-state/pagasa_daily_detector.json

      - name: Commit durable PAGASA results
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('.klaxon-state/pagasa_state.json', '.klaxon-state/pagasa_daily_detector.json') != '' }}
        run: |
          cd .klaxon-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagasa_state.json pagasa_daily_detector.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Klaxon PAGASA state"
            git push origin HEAD:klaxon-state
          fi
