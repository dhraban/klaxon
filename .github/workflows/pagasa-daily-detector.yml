name: Klaxon PAGASA daily detector

on:
  schedule:
    # 4:40 AM Bohol time (UTC+8) = 8:40 PM UTC.
    - cron: "40 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-cyclone:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      PUSHOVER_APPLICATION_TOKEN: ${{ secrets.PUSHOVER_APPLICATION_TOKEN }}
    steps:
      - name: Download Klaxon
        uses: actions/checkout@v4

      - name: Restore PAGASA monitor state
        uses: actions/cache/restore@v4
        with:
          path: pagasa_state.json
          key: pagasa-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pagasa-state-

      - name: Install PDF reader
        run: python3 -m pip install --disable-pip-version-check --no-warn-script-location -r requirements.txt

      - name: Run daily PAGASA detector
        run: >-
          python3 pagasa_cyclone_check.py
          --mode daily-detector
          --state-file pagasa_state.json
          --output pagasa_daily_detector.json
          --send-pushover
          --pretty

      - name: Preserve daily cyclone result for morning brief
        if: ${{ always() && hashFiles('pagasa_daily_detector.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: pagasa_daily_detector.json
          key: pagasa-daily-result-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve PAGASA monitor state
        if: ${{ always() && hashFiles('pagasa_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: pagasa_state.json
          key: pagasa-state-${{ github.run_id }}-${{ github.run_attempt }}
