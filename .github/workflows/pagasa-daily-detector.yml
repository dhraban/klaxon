name: Klaxon PAGASA daily detector

on:
  schedule:
    # Run at both possible UTC offsets; the first step gates this to 5:55 AM
    # America/Chicago, including daylight-saving time.
    - cron: "55 10,11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-cyclone:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Central-time schedule
        id: schedule
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(TZ=America/Chicago date +%H:%M)" = "05:55" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Klaxon
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Restore PAGASA monitor state
        if: steps.schedule.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: pagasa_state.json
          key: pagasa-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pagasa-state-

      - name: Install PDF reader
        if: steps.schedule.outputs.run == 'true'
        run: python3 -m pip install --disable-pip-version-check --no-warn-script-location -r requirements.txt

      - name: Run daily PAGASA detector without routine push
        if: steps.schedule.outputs.run == 'true'
        run: >-
          python3 pagasa_cyclone_check.py
          --mode daily-detector
          --state-file pagasa_state.json
          --output pagasa_daily_detector.json
          --pretty

      - name: Preserve daily cyclone result for morning brief
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('pagasa_daily_detector.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: pagasa_daily_detector.json
          key: pagasa-daily-result-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve PAGASA monitor state
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('pagasa_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: pagasa_state.json
          key: pagasa-state-${{ github.run_id }}-${{ github.run_attempt }}
