name: Klaxon Facebook monitor

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduling congestion.
    - cron: "7,22,37,52 * * * *"
    # Two separate UTC triggers cover the 4:35 AM America/Chicago audit across
    # daylight saving time. The audit gate accepts a delayed correct trigger.
    - cron: "35 9 * * *"
    - cron: "35 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose what to run manually"
        required: true
        type: choice
        options:
          - facebook
          - health-audit
        default: facebook

permissions:
  contents: write

concurrency:
  group: klaxon-state
  cancel-in-progress: false

jobs:
  check-facebook:
    if: >-
      ${{ (github.event_name != 'schedule' || (github.event.schedule != '35 9 * * *' && github.event.schedule != '35 10 * * *'))
      && (github.event_name != 'workflow_dispatch' || inputs.mode != 'health-audit') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KLAXON_CHROME_PATH: /usr/bin/google-chrome
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      PUSHOVER_APPLICATION_TOKEN: ${{ secrets.PUSHOVER_APPLICATION_TOKEN }}

    steps:
      - name: Download Klaxon
        uses: actions/checkout@v4

      - name: Restore duplicate history
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: klaxon_state.sqlite3
          key: klaxon-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            klaxon-state-

      - name: Download durable state branch
        uses: actions/checkout@v4
        with:
          ref: klaxon-state
          path: .klaxon-state
          fetch-depth: 1

      - name: Restore durable alert and schedule state
        run: >-
          python3 durable_state.py import
          --state-file klaxon_state.sqlite3
          --json-file .klaxon-state/facebook_state.json

      - name: Count scheduled watcher run
        if: ${{ github.event_name == 'schedule' }}
        run: python3 watcher_health.py --state-file klaxon_state.sqlite3 --increment

      - name: Install browser-scrolling component
        run: npm install --omit=dev --no-audit --no-fund

      - name: Check new BOHECO posts
        run: >-
          python3 klaxon_facebook_test.py
          --post-limit 25
          --send-pushover
          --output latest_post.json

      - name: Preserve latest power result for morning brief
        if: ${{ always() && hashFiles('latest_post.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: latest_post.json
          key: klaxon-power-result-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Export durable alert and schedule state
        if: ${{ always() && hashFiles('klaxon_state.sqlite3') != '' }}
        run: >-
          python3 durable_state.py export
          --state-file klaxon_state.sqlite3
          --json-file .klaxon-state/facebook_state.json

      - name: Commit durable alert and schedule state
        if: ${{ always() && hashFiles('.klaxon-state/facebook_state.json') != '' }}
        run: |
          cd .klaxon-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add facebook_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Klaxon Facebook state"
            git push origin HEAD:klaxon-state
          fi

      - name: Preserve duplicate history
        if: ${{ always() && hashFiles('klaxon_state.sqlite3') != '' }}
        uses: actions/cache/save@v4
        with:
          path: klaxon_state.sqlite3
          key: klaxon-state-${{ github.run_id }}-${{ github.run_attempt }}

  audit-watcher-health:
    if: >-
      ${{ (github.event_name == 'schedule' && (github.event.schedule == '35 9 * * *' || github.event.schedule == '35 10 * * *'))
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'health-audit') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check Central-time audit schedule
        id: schedule
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          offset="$(TZ=America/Chicago date +%z)"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$offset" = "-0500" ] && [ "$SCHEDULE_EXPRESSION" = "35 9 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$offset" = "-0600" ] && [ "$SCHEDULE_EXPRESSION" = "35 10 * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Klaxon
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Restore duplicate history
        if: steps.schedule.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: klaxon_state.sqlite3
          key: klaxon-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            klaxon-state-

      - name: Download durable state branch
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: klaxon-state
          path: .klaxon-state
          fetch-depth: 1

      - name: Restore durable alert and schedule state
        if: steps.schedule.outputs.run == 'true'
        run: >-
          python3 durable_state.py import
          --state-file klaxon_state.sqlite3
          --json-file .klaxon-state/facebook_state.json

      - name: Audit and reset watcher counter
        if: steps.schedule.outputs.run == 'true'
        run: >-
          python3 watcher_health.py
          --state-file klaxon_state.sqlite3
          --audit-and-reset
          --expected-runs 96
          --minimum-fraction 0.90
          --output watcher_health.json

      - name: Preserve duplicate history
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('klaxon_state.sqlite3') != '' }}
        uses: actions/cache/save@v4
        with:
          path: klaxon_state.sqlite3
          key: klaxon-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve watcher health result
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('watcher_health.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: watcher_health.json
          key: watcher-health-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve durable watcher health result
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('watcher_health.json') != '' }}
        run: cp watcher_health.json .klaxon-state/watcher_health.json

      - name: Commit durable watcher health result
        if: ${{ steps.schedule.outputs.run == 'true' && always() && hashFiles('.klaxon-state/watcher_health.json') != '' }}
        run: |
          cd .klaxon-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watcher_health.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Klaxon watcher health"
            git push origin HEAD:klaxon-state
          fi
