name: Klaxon Facebook monitor

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduling congestion.
    - cron: "7,22,37,52 * * * *"
    # 7:15 AM Philippine time (UTC+8) for the previous day's run-count audit.
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose what to run manually"
        required: true
        type: choice
        options:
          - facebook
          - health-audit
        default: facebook

permissions:
  contents: read

concurrency:
  group: klaxon-facebook-monitor
  cancel-in-progress: false

jobs:
  check-facebook:
    if: >-
      ${{ (github.event_name != 'schedule' || github.event.schedule != '15 23 * * *')
      && (github.event_name != 'workflow_dispatch' || inputs.mode != 'health-audit') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KLAXON_CHROME_PATH: /usr/bin/google-chrome
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      PUSHOVER_APPLICATION_TOKEN: ${{ secrets.PUSHOVER_APPLICATION_TOKEN }}

    steps:
      - name: Download Klaxon
        uses: actions/checkout@v4

      - name: Restore duplicate history
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: klaxon_state.sqlite3
          key: klaxon-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            klaxon-state-

      - name: Count scheduled watcher run
        if: ${{ github.event_name == 'schedule' }}
        run: python3 watcher_health.py --state-file klaxon_state.sqlite3 --increment

      - name: Install browser-scrolling component
        run: npm install --omit=dev --no-audit --no-fund

      - name: Check new BOHECO posts
        run: >-
          python3 klaxon_facebook_test.py
          --post-limit 5
          --send-pushover
          --output latest_post.json

      - name: Preserve duplicate history
        if: ${{ always() && hashFiles('klaxon_state.sqlite3') != '' }}
        uses: actions/cache/save@v4
        with:
          path: klaxon_state.sqlite3
          key: klaxon-state-${{ github.run_id }}-${{ github.run_attempt }}

  audit-watcher-health:
    if: >-
      ${{ (github.event_name == 'schedule' && github.event.schedule == '15 23 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'health-audit') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      PUSHOVER_APPLICATION_TOKEN: ${{ secrets.PUSHOVER_APPLICATION_TOKEN }}

    steps:
      - name: Download Klaxon
        uses: actions/checkout@v4

      - name: Restore duplicate history
        uses: actions/cache/restore@v4
        with:
          path: klaxon_state.sqlite3
          key: klaxon-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            klaxon-state-

      - name: Audit and reset watcher counter
        run: >-
          python3 watcher_health.py
          --state-file klaxon_state.sqlite3
          --audit-and-reset
          --expected-runs 96
          --minimum-fraction 0.90
          --send-pushover

      - name: Preserve duplicate history
        if: ${{ always() && hashFiles('klaxon_state.sqlite3') != '' }}
        uses: actions/cache/save@v4
        with:
          path: klaxon_state.sqlite3
          key: klaxon-state-${{ github.run_id }}-${{ github.run_attempt }}
